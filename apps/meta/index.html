<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="0; url=../../v2-preview/?section=meta" />
  <title>Meta · PTCG Tools</title>
  <script>
    (() => {
      const child = new URL('../../v2-preview/apps/meta/', window.location.href);
      child.search = window.location.search;
      child.hash = window.location.hash;
      const shell = new URL('../../v2-preview/', window.location.href);
      shell.searchParams.set('section', 'meta');
      shell.searchParams.set('route', `${child.pathname}${child.search}${child.hash}`);
      window.location.replace(shell);
    })();
  </script>
</head>
<body>
  <p><a href="../../v2-preview/?section=meta">Open Meta</a></p>
</body>
</html>
