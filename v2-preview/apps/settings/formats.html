<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fb">
  <title>Formats &amp; Sets · Settings · PTCG Tools</title>
  <link rel="icon" type="image/png" href="../../assets/apple-touch-icon.png">
  <link rel="stylesheet" href="../_shared/app-shell.css?v=2">
  <link rel="stylesheet" href="./settings.css?v=6">
  <link rel="stylesheet" href="./format-settings.css?v=7">
</head>
<body class="ptcg-v2" data-app-root="../.." data-app-section="settings">
  <header class="app-shell-header">
    <a class="app-shell-brand" href="./" aria-label="Back to Settings"><span class="app-shell-mark" aria-hidden="true">←</span><span class="app-shell-brand-copy"><strong>Formats &amp; Sets</strong><small>Settings · Maintenance</small></span></a>
  </header>
  <main class="app-shell-page settings-page settings-subpage">
    <section class="settings-section" aria-labelledby="formatsHeading">
      <div class="settings-section-head"><span class="settings-kicker">Shared data</span><h1 id="formatsHeading">Formats &amp; Sets</h1><p>Maintain release dates, Online/IRL legality and rotation. Card legality always uses each printing's regulation mark.</p></div>
      <div class="format-calendar-shell">
        <div id="formatCalendarSummary" class="format-calendar-summary app-card"><div class="settings-empty">Loading shared format calendar…</div></div>
        <p id="formatAccessMessage" class="format-access">Checking maintenance access…</p>
        <div id="formatAdminControls" class="format-admin-controls" hidden>
          <div id="formatSetList" class="format-set-list"></div>
          <div class="format-maintenance-bar">
            <button id="addFormatSet" class="format-add" type="button">+ Set</button>
            <div class="format-actions"><button id="saveFormatCalendar" class="primary" type="button">Save changes</button></div>
          </div>
          <details class="format-notes-disclosure">
            <summary>Maintenance notes <span>optional</span></summary>
            <label class="format-notes-label"><textarea id="formatPublishNotes" placeholder="What changed and where the dates came from"></textarea></label>
          </details>
        </div>
        <p id="formatCalendarMessage" class="format-calendar-message" aria-live="polite"></p>
      </div>
    </section>
  </main>
  <script src="../_shared/storage.js?v=6"></script>
  <script src="../_shared/deckParser.js?v=2"></script>
  <script src="../_shared/deck-store.js?v=5"></script>
  <script src="../_shared/format-resolver.js?v=2"></script>
  <script src="../_shared/cloud-sync.js?v=7"></script>
  <script src="../_shared/format-calendar-store.js?v=1"></script>
  <script src="../_shared/auth-ui.js?v=4"></script>
  <script src="./format-settings.js?v=4"></script>
  <script src="../_shared/app-shell.js?v=7"></script>
</body>
</html>
