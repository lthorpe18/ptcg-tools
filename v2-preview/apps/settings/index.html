<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fb">
  <title>Settings · PTCG Tools</title>
  <link rel="stylesheet" href="../_shared/app-shell.css?v=2">
  <link rel="stylesheet" href="./settings.css?v=2">
  <link rel="stylesheet" href="../meta/sprite-polish.css?v=3">
</head>
<body class="ptcg-v2" data-app-root="../.." data-app-section="settings">
  <header class="app-shell-header">
    <a class="app-shell-brand" href="../../" aria-label="PTCG Tools home"><span class="app-shell-mark" aria-hidden="true">⚙</span><span class="app-shell-brand-copy"><strong>Settings</strong><small>App preferences</small></span></a>
  </header>
  <main class="app-shell-page settings-page">
    <section class="settings-intro">
      <h1>Deck icons</h1>
      <p>Choose the representative Pokémon used anywhere an archetype appears. These overrides only affect presentation.</p>
      <label class="settings-search"><span>⌕</span><input id="deckIconSearch" type="search" placeholder="Search decks" autocomplete="off"></label>
    </section>
    <div id="deckIconList" class="deck-icon-list"><div class="settings-empty">Loading deck names…</div></div>
  </main>
  <script src="../meta/sprites.js?v=4"></script>
  <script src="./settings.js?v=1"></script>
  <script src="../_shared/app-shell.js?v=3"></script>
</body>
</html>
