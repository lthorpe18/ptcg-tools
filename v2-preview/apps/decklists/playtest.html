<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Playtest · PTCG Tools</title>
  <link rel="icon" type="image/png" href="../../assets/apple-touch-icon.png">
  <link rel="stylesheet" href="../_shared/app-shell.css?v=2">
  <link rel="stylesheet" href="playtest.css?v=1">
</head>
<body class="ptcg-v2 playtest-body" data-app-root="../.." data-app-section="decks">
  <header class="playtest-header">
    <button id="backButton" class="icon-button" type="button" aria-label="Back">‹</button>
    <div class="playtest-title"><strong id="deckTitle">Playtest</strong><span id="deckIdentity">Loading exact list…</span></div>
    <button id="resetButton" class="icon-button" type="button" aria-label="New setup">↻</button>
  </header>

  <main id="playtestApp" class="playtest-app" hidden>
    <section class="turn-strip" aria-label="Turn state">
      <div><small>TURN</small><strong id="turnNumber">1</strong></div>
      <div><small>COIN</small><strong id="coinResult">—</strong></div>
      <button id="endTurn" type="button">End turn</button>
    </section>

    <section class="field-grid">
      <article class="zone-card major-zone" data-open-zone="active">
        <header><span>Active</span><b id="activeCount">0</b></header>
        <div id="activeZone" class="zone-content empty-zone">Tap a card in hand to set Active.</div>
      </article>
      <article class="zone-card stadium-zone" data-open-zone="stadium">
        <header><span>Stadium</span><b id="stadiumCount">0</b></header>
        <div id="stadiumZone" class="zone-content empty-zone">Empty</div>
      </article>
    </section>

    <article class="zone-card bench-zone">
      <header><span>Bench</span><b id="benchCount">0</b></header>
      <div id="benchZone" class="bench-list empty-zone">Tap a card in hand to Bench it.</div>
    </article>

    <article class="zone-card hand-zone">
      <header><span>Hand</span><b id="handCount">0</b></header>
      <div id="handZone" class="hand-list"></div>
    </article>

    <section class="zone-strip" aria-label="Other zones">
      <button type="button" data-zone-button="deck"><span>Deck</span><b id="deckCount">0</b></button>
      <button type="button" data-zone-button="prizes"><span>Prizes</span><b id="prizesCount">0</b></button>
      <button type="button" data-zone-button="discard"><span>Discard</span><b id="discardCount">0</b></button>
      <button type="button" data-zone-button="lost"><span>Lost Zone</span><b id="lostCount">0</b></button>
    </section>

    <details class="history-card">
      <summary><span>History</span><small id="historySummary">Setup ready</small></summary>
      <div id="historyList" class="history-list"></div>
    </details>
  </main>

  <nav id="quickActions" class="quick-actions" hidden aria-label="Playtest actions">
    <button id="drawButton" type="button"><span>＋</span>Draw</button>
    <button id="searchButton" type="button"><span>⌕</span>Search</button>
    <button id="shuffleButton" type="button"><span>⤨</span>Shuffle</button>
    <button id="coinButton" type="button"><span>◐</span>Coin</button>
    <button id="undoButton" type="button" disabled><span>↶</span>Undo</button>
  </nav>

  <div id="fatal" class="fatal-card" hidden></div>
  <div id="toast" class="playtest-toast" role="status" aria-live="polite" hidden></div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close-sheet></div>
    <section class="sheet-card playtest-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle"></div>
      <div class="sheet-head"><div><small id="sheetEyebrow">CARD</small><h2 id="sheetTitle">Card</h2><p id="sheetMeta"></p></div><button class="sheet-close" data-close-sheet type="button" aria-label="Close">×</button></div>
      <div id="sheetBody" class="sheet-body"></div>
    </section>
  </div>

  <script src="../_shared/deckParser.js?v=3"></script>
  <script src="../_shared/deck-store.js?v=5"></script>
  <script src="../_shared/playtest-launch.js?v=1"></script>
  <script src="playtest.js?v=1"></script>
</body>
</html>
