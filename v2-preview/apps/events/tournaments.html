<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>My Tournaments · PTCG Tools</title>
  <link rel="icon" type="image/png" href="../../assets/apple-touch-icon.png">
  <link rel="stylesheet" href="../_shared/app-shell.css?v=2">
  <link rel="stylesheet" href="./tournaments.css?v=2">
</head>
<body class="ptcg-v2" data-app-root="../.." data-app-section="compete">
  <header class="app-shell-header">
    <a class="app-shell-brand" href="../../" aria-label="PTCG Tools home"><span class="app-shell-mark" aria-hidden="true">◆</span><span class="app-shell-brand-copy"><strong>PTCG Tools</strong><small>Events</small></span></a>
    <div class="app-shell-header-actions"><span class="app-context-pill">My Tournaments</span></div>
  </header>
  <main class="app-shell-page tournaments-shell">
    <div class="app-page-head tournaments-head"><div><div class="app-eyebrow">Compete</div><h1>My Tournaments</h1><p>Your tournament records, linked events and results.</p></div><a class="record-link" href="./">＋ Record</a></div>

    <nav class="app-segmented event-view-tabs compete-view-tabs" aria-label="Compete views">
      <a href="./?view=nearby" aria-selected="false">Nearby</a>
      <a href="./?view=majors" aria-selected="false">Majors</a>
      <a href="./tournaments.html" aria-selected="true">My Tournaments</a>
    </nav>

    <div class="tournament-toolbar">
      <nav class="tournament-filters" aria-label="Tournament filters">
        <button type="button" data-filter="all" class="active">All</button>
        <button type="button" data-filter="current">Current</button>
        <button type="button" data-filter="upcoming">Upcoming</button>
        <button type="button" data-filter="completed">Completed</button>
        <button type="button" data-filter="archived">Archived</button>
      </nav>
      <div id="tournamentSummary" class="tournament-summary"></div>
    </div>

    <section id="tournamentList" class="tournament-list" aria-live="polite"></section>
  </main>

  <div id="editBackdrop" class="manage-backdrop hidden" aria-hidden="true"><section class="manage-sheet" role="dialog" aria-modal="true" aria-labelledby="editTitle"><div class="manage-head"><div><small>Edit record</small><h2 id="editTitle">Tournament details</h2></div><button id="closeEdit" type="button" aria-label="Close">×</button></div><form id="editForm"><input id="editId" type="hidden"><label><span>Name</span><input id="editName" type="text" autocomplete="off"></label><div class="edit-grid"><label><span>Date</span><input id="editDate" type="date"></label><label><span>Type</span><select id="editType"><option>League / Local</option><option>League Challenge</option><option>League Cup</option><option>Prerelease</option><option>Regional</option><option>International</option><option>World Championships</option><option>Online Tournament</option><option>Other</option></select></label></div><button class="primary-action" type="submit">Save changes</button></form></section></div>
  <div id="toast" class="manage-toast hidden" role="status" aria-live="polite"></div>

  <script src="../_shared/storage.js?v=6"></script>
  <script src="../_shared/match-store.js?v=2"></script>
  <script src="../_shared/sprites.js?v=1"></script>
  <script src="./tournaments.js?v=4"></script>
  <script src="../_shared/app-shell.js?v=7"></script>
</body>
</html>
