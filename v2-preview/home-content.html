<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PTCG Tools">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>PTCG Tools</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./assets/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./apps/_shared/app-shell.css?v=2">
  <link rel="stylesheet" href="./apps/_shared/auth-ui.css?v=1">
  <link rel="stylesheet" href="./styles.css?v=14">
  <link rel="stylesheet" href="./home-tweaks.css?v=1">
</head>
<body class="ptcg-v2" data-app-root="." data-app-section="home">
  <header class="app-shell-header home-header">
    <a class="app-shell-brand" href="./" aria-label="PTCG Tools home">
      <span class="app-shell-mark" aria-hidden="true">◆</span>
      <span class="app-shell-brand-copy"><strong>PTCG Tools</strong></span>
    </a>
    <div class="app-shell-header-actions">
      <span id="formatPill" class="app-context-pill"><span class="app-live-dot"></span><span>Standard</span></span>
      <a class="home-account-link" href="./apps/settings/" aria-label="Account settings"><span class="home-account-dot" aria-hidden="true"></span><span data-ptcg-auth-status>Not signed in</span></a>
      <a class="home-settings-link" href="./apps/settings/" aria-label="Settings">⚙</a>
    </div>
  </header>

  <main class="app-shell-page home-shell">
    <section class="home-meta-hero" aria-labelledby="homeBlendedMetaTitle">
      <div class="home-meta-head">
        <span class="home-field-pill"><span aria-hidden="true">▥</span> Current field</span>
        <h1 id="homeBlendedMetaTitle">Blended Meta</h1>
        <p>IRL latest major weekend + Online since last major weekend</p>
      </div>

      <div id="blendedMetaPreview" class="home-meta-chart" aria-label="Blended Meta top five">
        <div class="home-meta-bar-item"><div class="home-meta-bar" style="--bar:100%"><span>—</span></div><div class="home-meta-sprite-placeholder">◆</div></div>
        <div class="home-meta-bar-item"><div class="home-meta-bar" style="--bar:70%"><span>—</span></div><div class="home-meta-sprite-placeholder">◆</div></div>
        <div class="home-meta-bar-item"><div class="home-meta-bar" style="--bar:58%"><span>—</span></div><div class="home-meta-sprite-placeholder">◆</div></div>
        <div class="home-meta-bar-item"><div class="home-meta-bar" style="--bar:42%"><span>—</span></div><div class="home-meta-sprite-placeholder">◆</div></div>
        <div class="home-meta-bar-item"><div class="home-meta-bar" style="--bar:34%"><span>—</span></div><div class="home-meta-sprite-placeholder">◆</div></div>
      </div>
    </section>

    <div class="home-personal-grid">
      <section class="home-personal-card home-deck-card" data-home-card-target="deckPreview" tabindex="0" role="link" aria-label="Open my deck">
        <div class="home-card-heading"><span class="home-card-icon">▤</span><h2>My Deck</h2></div>
        <a id="deckPreview" class="home-area-preview home-card-preview" href="./apps/decklists/"></a>
      </section>

      <section class="home-personal-card home-event-card" data-home-card-target="competePreview" tabindex="0" role="link" aria-label="View next event">
        <div class="home-card-heading"><span class="home-card-icon">□</span><h2>Next Event</h2></div>
        <a id="competePreview" class="home-area-preview home-card-preview" href="./apps/events/"></a>
      </section>
    </div>

    <nav class="home-quick-actions" aria-label="Quick actions">
      <a href="./apps/decklists/"><span class="home-quick-icon">⌕</span><span>Card Search</span></a>
      <a href="./apps/tools/#cut"><span class="home-quick-icon warm">✂</span><span>Cut / ID</span></a>
      <a href="./apps/decklists/"><span class="home-quick-icon">▷</span><span>Playtest</span></a>
    </nav>

    <a class="home-play-card" href="./apps/meta/#prep">
      <div class="home-play-copy">
        <span class="home-play-icon" aria-hidden="true">✦</span>
        <span><strong>What should I play?</strong><small>Analyse the expected field</small></span>
      </div>
      <div class="home-play-graphic" aria-hidden="true">
        <span class="home-play-dot grass">●</span><span class="home-play-dot fire">●</span><span class="home-play-dot water">●</span><span class="home-play-dot lightning">●</span><span class="home-play-dot psychic">●</span>
        <i style="--h:48%"></i><i style="--h:70%"></i><i style="--h:43%"></i><i style="--h:84%"></i><i style="--h:58%"></i><i style="--h:92%"></i><i style="--h:61%"></i><i style="--h:76%"></i>
        <svg viewBox="0 0 100 32" preserveAspectRatio="none"><path d="M1 24 C15 16,24 25,36 17 S55 9,67 17 S83 23,99 10" /></svg>
      </div>
      <b class="home-play-chevron">›</b>
    </a>
  </main>

  <script src="./apps/_shared/storage.js?v=6"></script>
  <script src="./apps/_shared/deckParser.js?v=2"></script>
  <script src="./apps/_shared/deck-store.js?v=5"></script>
  <script src="./apps/meta/sprites.js?v=5"></script>
  <script src="./apps/_shared/season-engine.js?v=2"></script>
  <script src="./apps/_shared/season-rules-2027.js?v=1"></script>
  <script src="./apps/_shared/season-config-2027.js?v=1"></script>
  <script src="./apps/_shared/cloud-sync.js?v=6"></script>
  <script src="./apps/_shared/auth-ui.js?v=4"></script>
  <script src="./scripts/home.js?v=11"></script>
  <script src="./apps/_shared/app-shell.js?v=7"></script>
</body>
</html>
