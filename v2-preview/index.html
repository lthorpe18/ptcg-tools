<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PTCG Tools">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>PTCG Tools</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./apps/_shared/app-shell.css?v=2">
  <link rel="stylesheet" href="./styles.css?v=6">
</head>
<body class="ptcg-v2" data-app-root="." data-app-section="home">
  <header class="app-shell-header home-header">
    <a class="app-shell-brand" href="./" aria-label="PTCG Tools home">
      <span class="app-shell-mark" aria-hidden="true">◆</span>
      <span class="app-shell-brand-copy"><strong>PTCG Tools</strong></span>
    </a>
    <div class="app-shell-header-actions">
      <span id="formatPill" class="app-context-pill"><span class="app-live-dot"></span><span>Standard</span></span>
      <a class="home-settings-link" href="./apps/settings/" aria-label="Settings">⚙</a>
    </div>
  </header>

  <main class="app-shell-page home-shell">
    <div class="home-title-row"><h1>Home</h1></div>

    <div class="home-area-grid">
      <section class="home-area-card area-meta">
        <div class="home-area-head"><span class="home-area-icon">◈</span><h2>Meta</h2></div>
        <div class="home-area-actions">
          <a href="./apps/meta/?v=20260901-search-settings"><span>What should I play?</span><b>›</b></a>
          <a href="./apps/meta/?v=20260901-search-settings#overview"><span>Field &amp; matchups</span><b>›</b></a>
        </div>
      </section>

      <section class="home-area-card area-decks">
        <div class="home-area-head"><span class="home-area-icon">▤</span><h2>Decks</h2></div>
        <div class="home-area-actions">
          <a href="./apps/decklists/"><span>My decks</span><b>›</b></a>
          <a href="./apps/decklists/"><span>Versions &amp; odds</span><b>›</b></a>
        </div>
      </section>

      <section class="home-area-card area-compete">
        <div class="home-area-head"><span class="home-area-icon">◇</span><div class="home-area-title"><h2>Compete</h2><small id="competeStatus" hidden></small></div></div>
        <div class="home-area-actions">
          <a href="./apps/events/"><span>Events</span><b>›</b></a>
          <a href="./apps/swiss/"><span>Tournament manager</span><b>›</b></a>
        </div>
      </section>

      <section class="home-area-card area-tools">
        <div class="home-area-head"><span class="home-area-icon">⊕</span><h2>Tools</h2></div>
        <div class="home-area-actions">
          <a href="./apps/tools/#cut"><span>Cut calculator</span><b>›</b></a>
          <a href="./apps/tools/"><span>Deck maths</span><b>›</b></a>
        </div>
      </section>
    </div>
  </main>

  <script src="./apps/_shared/storage.js?v=3"></script>
  <script src="./apps/_shared/cloud-sync.js?v=1"></script>
  <script src="./apps/_shared/shared-sync.js?v=1"></script>
  <script src="./scripts/home.js?v=4"></script>
  <script src="./apps/_shared/app-shell.js?v=2"></script>
</body>
</html>
