<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PTCG Tools">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>PTCG Tools</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./assets/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./perf-shell/shell.css?v=2">
</head>
<body>
  <main id="shellViews" class="shell-views" aria-live="polite">
    <iframe class="shell-view is-active" data-section="home" title="Home" src="./home-content.html"></iframe>
    <iframe class="shell-view" data-section="meta" title="Meta" data-src="./apps/meta/"></iframe>
    <iframe class="shell-view" data-section="decks" title="Decks" data-src="./apps/decklists/"></iframe>
    <iframe class="shell-view" data-section="compete" title="Compete" data-src="./apps/events/"></iframe>
    <iframe class="shell-view" data-section="tools" title="Tools" data-src="./apps/tools/"></iframe>
  </main>

  <nav class="shell-nav" aria-label="PTCG Tools">
    <button type="button" class="shell-nav-item is-active" data-target="home" aria-current="page"><span class="shell-nav-icon">⌂</span><span>Home</span></button>
    <button type="button" class="shell-nav-item" data-target="meta"><span class="shell-nav-icon">◈</span><span>Meta</span></button>
    <button type="button" class="shell-nav-item" data-target="decks"><span class="shell-nav-icon">▤</span><span>Decks</span></button>
    <button type="button" class="shell-nav-item" data-target="compete"><span class="shell-nav-icon">◇</span><span>Compete</span></button>
    <button type="button" class="shell-nav-item" data-target="tools"><span class="shell-nav-icon">⊕</span><span>Tools</span></button>
  </nav>

  <div id="shellStatus" class="shell-status" aria-live="polite" hidden></div>
  <script src="./scripts/persistent-shell.js?v=1"></script>
</body>
</html>
