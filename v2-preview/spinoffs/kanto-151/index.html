<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101319">
  <title>Kanto 151</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./cloud-persistence.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Kanto collection</p>
      <h1>151</h1>
    </div>
    <div class="progress" aria-live="polite">
      <strong id="owned-count">0 / 151 owned</strong>
      <span id="chosen-count">0 chosen</span>
      <div class="cloud-save-line">
        <span id="cloud-status" data-mode="syncing">Checking save…</span>
        <button id="cloud-sign-in" class="cloud-sign-in" type="button" hidden>Sign in to save</button>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <section id="pokedex-grid" class="pokedex-grid" aria-label="Kanto Pokédex card grid"></section>
  </main>

  <dialog id="search-dialog" class="search-dialog">
    <div class="search-sheet">
      <header class="sheet-header">
        <div hidden>
          <p id="picker-number">#001</p>
          <h2 id="picker-title">Bulbasaur</h2>
        </div>
        <button id="close-picker" class="icon-button" type="button" aria-label="Close card search">×</button>
      </header>

      <form id="search-form" class="search-form" role="search">
        <label class="sr-only" for="card-search">Search cards</label>
        <input id="card-search" type="search" inputmode="search" autocomplete="off" autocapitalize="words" spellcheck="false">
        <button type="submit" class="search-button">Search</button>
      </form>

      <div class="quick-filter-row" aria-label="Quick card filters">
        <label class="sr-only" for="filter-set">Set code</label>
        <input id="filter-set" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Set code">
        <label class="sr-only" for="filter-illustrator">Illustrator</label>
        <input id="filter-illustrator" type="text" autocomplete="off" placeholder="Illustrator">
        <button id="filters-toggle" class="secondary-button" type="button" aria-expanded="false">Filters ▾</button>
      </div>

      <div class="choice-actions">
        <button id="remove-choice" class="text-button danger" type="button" hidden>Remove choice</button>
      </div>

      <section id="filters-panel" class="filters-panel" hidden aria-label="Card filters">
        <label>Rarity
          <select id="filter-rarity"><option value="">Any rarity</option></select>
        </label>
        <label>Regulation mark
          <select id="filter-regulation">
            <option value="">Any mark</option>
            <option>J</option><option>I</option><option>H</option><option>G</option><option>F</option><option>E</option>
          </select>
        </label>
        <label class="check-filter"><input id="filter-standard" type="checkbox"> Standard legal</label>
        <button id="clear-filters" class="secondary-button full-width" type="button">Clear filters</button>
      </section>

      <p id="results-status" class="results-status" aria-live="polite"></p>
      <section id="card-results" class="card-results" aria-label="Card search results"></section>
      <button id="show-more" class="secondary-button show-more" type="button" hidden>Show more</button>
    </div>
  </dialog>

  <dialog id="zoom-dialog" class="zoom-dialog">
    <div class="zoom-card">
      <button id="close-zoom" class="icon-button zoom-close" type="button" aria-label="Close card preview">×</button>
      <img id="zoom-image" alt="">
      <div class="zoom-copy">
        <strong id="zoom-name"></strong>
        <span id="zoom-meta"></span>
      </div>
      <button id="zoom-choose" class="primary-button" type="button">+ Choose this card</button>
    </div>
  </dialog>

  <script src="../../apps/_shared/card-catalog.js"></script>
  <script src="../../apps/_shared/card-images.js"></script>
  <script src="./cloud-persistence.js"></script>
  <script src="./app.js"></script>
  <script src="./search-filter-reset.js"></script>
  <script src="./image-fallback.js"></script>
</body>
</html>
