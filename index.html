<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PTCG Tools">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>PTCG Tools</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./apps/_shared/app-shell.css?v=2">
  <link rel="stylesheet" href="./styles.css?v=3">
</head>
<body class="ptcg-v2" data-app-root="." data-app-section="home">
  <header class="app-shell-header home-header">
    <a class="app-shell-brand" href="./" aria-label="PTCG Tools home">
      <span class="app-shell-mark" aria-hidden="true">◆</span>
      <span class="app-shell-brand-copy"><strong>PTCG Tools</strong></span>
    </a>
    <div class="app-shell-header-actions"><span id="formatPill" class="app-context-pill"><span class="app-live-dot"></span><span>Standard</span></span></div>
  </header>

  <main class="app-shell-page home-shell">
    <div class="home-title-row"><h1>Home</h1></div>

    <section id="nextEventSection" class="home-event-section" hidden>
      <div class="home-section-label">Next event</div>
      <a id="nextEventCard" class="app-card home-next-event" href="./apps/events/"></a>
    </section>

    <section class="home-tools" aria-label="PTCG Tools shortcuts">
      <a class="home-tool-card" href="./apps/meta/">
        <span class="home-tool-icon meta">✦</span>
        <strong>What should I play?</strong>
      </a>
      <a class="home-tool-card" href="./apps/meta/#overview">
        <span class="home-tool-icon field">▥</span>
        <strong>Meta & matchups</strong>
      </a>
      <a class="home-tool-card" href="./apps/decklists/">
        <span class="home-tool-icon decks">▤</span>
        <strong>My decks</strong>
      </a>
      <a class="home-tool-card" href="./apps/events/">
        <span class="home-tool-icon events">⌖</span>
        <strong>Find events</strong>
      </a>
      <a class="home-tool-card" href="./apps/tools/#cut">
        <span class="home-tool-icon cut">%</span>
        <strong>Cut calculator</strong>
      </a>
      <a class="home-tool-card" href="./apps/swiss/">
        <span class="home-tool-icon tournament">↻</span>
        <strong>Run tournament</strong>
      </a>
    </section>
  </main>

  <script src="./apps/_shared/storage.js?v=1"></script>
  <script src="./scripts/home.js?v=2"></script>
  <script src="./apps/_shared/app-shell.js?v=2"></script>
</body>
</html>
