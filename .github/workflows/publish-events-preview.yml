name: Publish Events V2 Preview

on:
  workflow_dispatch:
  push:
    branches: [ptcg-tools-v2]
    paths:
      - '.github/workflows/publish-events-preview.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V2 source
        uses: actions/checkout@v4
        with:
          ref: ptcg-tools-v2
          path: v2src
      - name: Check out main preview
        uses: actions/checkout@v4
        with:
          ref: main
          path: mainsrc
      - name: Copy validated milestone
        run: |
          set -euo pipefail
          mkdir -p mainsrc/v2-preview/apps/events mainsrc/v2-preview/apps/_shared mainsrc/v2-preview/scripts mainsrc/v2-preview/data
          cp v2src/apps/events/index.html mainsrc/v2-preview/apps/events/index.html
          cp v2src/apps/events/app.js mainsrc/v2-preview/apps/events/app.js
          cp v2src/apps/events/styles.css mainsrc/v2-preview/apps/events/styles.css
          cp v2src/apps/_shared/storage.js mainsrc/v2-preview/apps/_shared/storage.js
          cp v2src/scripts/home.js mainsrc/v2-preview/scripts/home.js
          cp v2src/index.html mainsrc/v2-preview/index.html
          cp v2src/data/events.json mainsrc/v2-preview/data/events.json
      - name: Commit preview snapshot
        working-directory: mainsrc
        run: |
          if [ -z "$(git status --porcelain -- v2-preview)" ]; then
            echo 'Preview already matches validated V2 files.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2-preview
          git commit -m 'Publish Events V2 milestone preview'
          git push origin HEAD:main
