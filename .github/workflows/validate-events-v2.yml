name: Validate Events V2

on:
  workflow_dispatch:
  push:
    branches: [ptcg-tools-v2]
    paths:
      - 'apps/events/**'
      - 'apps/_shared/storage.js'
      - 'scripts/home.js'
      - '.github/workflows/validate-events-v2.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse JavaScript
        run: |
          node --check apps/events/app.js
          node --check apps/_shared/storage.js
          node --check scripts/home.js
      - name: Validate event data
        run: python -m json.tool data/events.json > /dev/null
      - name: Validate Events DOM references
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('apps/events/index.html').read_text()
          js = Path('apps/events/app.js').read_text()
          html_ids = set(re.findall(r'id="([^"]+)"', html))
          js_ids = set(re.findall(r"\$\('([^']+)'\)", js))
          missing = sorted(js_ids - html_ids)
          if missing:
              raise SystemExit(f'Missing DOM ids: {missing}')
          required = {'nearbyFilters','majorFilters','attendingFilters','eventList','statusBackdrop'}
          absent = sorted(required - html_ids)
          if absent:
              raise SystemExit(f'Missing required UI ids: {absent}')
          print(f'Validated {len(js_ids)} JS DOM references and {len(html_ids)} HTML ids')
          PY
