name: Publish Meta source grouping preview

on:
  push:
    branches: [ptcg-tools-v2]
    paths: ['.github/workflows/publish-meta-source-grouping.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ptcg-tools-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Meta source/grouping changes
        run: |
          node --check apps/meta/archetype-groups.js
          node --check apps/meta/source-controls.js
          node --check apps/meta/field-builder.js
          node --check apps/meta/prep.js
          python - <<'PY'
          from pathlib import Path
          html=Path('apps/meta/index.html').read_text()
          for x in ['metaFieldSource','metaMatchupSource','archetypeGrouping']:
              assert f'id="{x}"' in html, x
          field=Path('apps/meta/field-builder.js').read_text()
          prep=Path('apps/meta/prep.js').read_text()
          assert 'ArchetypeGroups?.groupRows' in field
          assert 'ArchetypeGroups?.variants' in field
          assert 'ArchetypeGroups?.aggregateRecords' in prep
          print('Meta source/grouping validation passed')
          PY
      - name: Stage Meta preview
        run: |
          mkdir -p /tmp/meta-preview
          cp -R apps/meta/. /tmp/meta-preview/
      - name: Publish to main preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          rm -rf v2-preview/apps/meta
          mkdir -p v2-preview/apps/meta
          cp -R /tmp/meta-preview/. v2-preview/apps/meta/
          git add v2-preview/apps/meta
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Meta source controls and archetype grouping'
          git push origin HEAD:main
