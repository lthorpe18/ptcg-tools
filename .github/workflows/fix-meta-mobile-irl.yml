name: Fix Meta mobile IRL controls

on:
  push:
    branches: [ptcg-tools-v2]
    paths: ['.github/workflows/fix-meta-mobile-irl.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ptcg-tools-v2
          fetch-depth: 0
      - name: Patch source
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('apps/meta/meta-home.css')
          s=p.read_text()
          extra='''\n/* Mobile ownership/layout fix: keep Current Meta controls inside the viewport. */\n.meta-home,.meta-home-head,.meta-home-tools{min-width:0;max-width:100%}\n.compact-select{max-width:100%;min-width:0}\n@media(max-width:600px){\n  .meta-home-head{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:start}\n  .source-segment{display:grid;grid-template-columns:1fr 1fr;width:100%;min-width:0;box-sizing:border-box}\n  .source-segment button{min-width:0;width:100%;padding:0 8px}\n  .meta-home-tools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;width:100%;min-width:0}\n  .meta-home-tools .compact-select{width:100%;min-width:0;box-sizing:border-box}\n  .variant-grouping-control{min-width:0;max-width:128px;white-space:normal;line-height:1.05}\n  .current-stats{width:100%;min-width:0}\n  .current-meta-list{width:100%;min-width:0}\n}\n'''
          if 'Mobile ownership/layout fix' not in s:
              s += extra
          p.write_text(s)

          p=Path('apps/meta/index.html')
          s=p.read_text()
          s=s.replace('meta-home.css?v=3','meta-home.css?v=4')
          s=s.replace('irl-labs.js?v=3','irl-labs.js?v=4')
          s=s.replace('meta-window-fix.js?v=1','meta-window-fix.js?v=2')
          if 'irl-scope.js?v=3' not in s:
              s=s.replace('<script src="meta-window-fix.js?v=2"></script>', '<script src="meta-window-fix.js?v=2"></script>\n<script src="irl-scope.js?v=3"></script>')
          p.write_text(s)
          PY
      - name: Validate source
        run: |
          node --check apps/meta/meta-window-fix.js
          node --check apps/meta/irl-labs.js
          node --check apps/meta/irl-scope.js
          grep -q 'irl-scope.js?v=3' apps/meta/index.html
          grep -q 'meta-home.css?v=4' apps/meta/index.html
          ! grep -q 'script.dataset.irlScope' apps/meta/irl-labs.js
          grep -q "if (!onlineActive() || !history" apps/meta/meta-window-fix.js
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/meta/meta-home.css apps/meta/index.html apps/meta/meta-window-fix.js apps/meta/irl-labs.js apps/meta/irl-scope.js
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Meta mobile IRL controls'
            git push origin HEAD:ptcg-tools-v2
          fi
      - name: Stage published files
        run: |
          mkdir -p /tmp/meta-fix
          cp apps/meta/meta-home.css apps/meta/index.html apps/meta/meta-window-fix.js apps/meta/irl-labs.js apps/meta/irl-scope.js /tmp/meta-fix/
      - name: Publish preview
        run: |
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/meta-fix/meta-home.css v2-preview/apps/meta/meta-home.css
          cp /tmp/meta-fix/index.html v2-preview/apps/meta/index.html
          cp /tmp/meta-fix/meta-window-fix.js v2-preview/apps/meta/meta-window-fix.js
          cp /tmp/meta-fix/irl-labs.js v2-preview/apps/meta/irl-labs.js
          cp /tmp/meta-fix/irl-scope.js v2-preview/apps/meta/irl-scope.js
          node --check v2-preview/apps/meta/meta-window-fix.js
          node --check v2-preview/apps/meta/irl-labs.js
          node --check v2-preview/apps/meta/irl-scope.js
          grep -q 'irl-scope.js?v=3' v2-preview/apps/meta/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2-preview/apps/meta
          git commit -m 'Publish fixed Meta IRL controls'
          git push origin HEAD:main
