name: Fix Meta row links once
on:
  push:
    branches: [ptcg-tools-v2]
    paths:
      - '.github/workflows/fix-meta-row-links-once.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ptcg-tools-v2
          fetch-depth: 0
      - run: python scripts/fix_meta_row_links_once.py
      - run: node --check apps/meta/meta-explorer-v2.js
      - run: grep -q 'meta-explorer-v2.js?v=4' apps/meta/index.html
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/meta/meta-explorer-v2.js apps/meta/index.html
          git commit -m 'Restore Current Meta deck links'
          git push origin HEAD:ptcg-tools-v2
      - run: |
          mkdir -p /tmp/meta-links
          cp apps/meta/meta-explorer-v2.js apps/meta/index.html /tmp/meta-links/
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/meta-links/meta-explorer-v2.js v2-preview/apps/meta/meta-explorer-v2.js
          cp /tmp/meta-links/index.html v2-preview/apps/meta/index.html
          node --check v2-preview/apps/meta/meta-explorer-v2.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2-preview/apps/meta/meta-explorer-v2.js v2-preview/apps/meta/index.html
          git commit -m 'Publish restored Meta deck links'
          git push origin HEAD:main
