name: Publish Meta source context once
on:
  push:
    branches: [ptcg-tools-v2]
    paths:
      - '.github/workflows/publish-source-context-once.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ptcg-tools-v2
          fetch-depth: 0
      - name: Wire shared source context
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/meta/index.html')
          s=p.read_text()
          if 'meta-source-context.css' not in s:
              s=s.replace('<link rel="stylesheet" href="meta-explorer-v2.css?v=3" />','<link rel="stylesheet" href="meta-explorer-v2.css?v=3" />\n  <link rel="stylesheet" href="meta-source-context.css?v=1" />')
          if 'meta-source-context.js' not in s:
              s=s.replace('<script src="meta-explorer-v2.js?v=3"></script>','<script src="meta-explorer-v2.js?v=3"></script>\n<script src="meta-source-context.js?v=1"></script>')
          p.write_text(s)
          PY
      - name: Validate source
        run: |
          node --check apps/meta/meta-source-context.js
          grep -q 'meta-source-context.css?v=1' apps/meta/index.html
          grep -q 'meta-source-context.js?v=1' apps/meta/index.html
          grep -q 'matchupSourceContext' apps/meta/meta-source-context.js
          grep -q 'deckSourceContext' apps/meta/meta-source-context.js
          grep -q 'playFieldSourceContext' apps/meta/meta-source-context.js
          grep -q 'deckDetailSourceContext' apps/meta/meta-source-context.js
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/meta/index.html
          git commit -m 'Show source scope and counts across Meta'
          git push origin HEAD:ptcg-tools-v2
      - name: Stage preview
        run: |
          mkdir -p /tmp/meta-source-context
          cp apps/meta/index.html apps/meta/meta-source-context.js apps/meta/meta-source-context.css /tmp/meta-source-context/
      - name: Publish preview
        run: |
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/meta-source-context/index.html v2-preview/apps/meta/index.html
          cp /tmp/meta-source-context/meta-source-context.js v2-preview/apps/meta/meta-source-context.js
          cp /tmp/meta-source-context/meta-source-context.css v2-preview/apps/meta/meta-source-context.css
          node --check v2-preview/apps/meta/meta-source-context.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2-preview/apps/meta
          git commit -m 'Publish Meta source context details'
          git push origin HEAD:main
