name: Update Meta Cache

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-meta.mjs'
      - '.github/workflows/update-meta.yml'

permissions:
  contents: write

concurrency:
  group: update-meta-cache
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build shared meta cache
        run: node scripts/update-meta.mjs
      - name: Commit cache if changed
        run: |
          if git diff --quiet -- data/meta/standard.json; then
            echo "No cache changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta/standard.json
          git commit -m "Update Limitless meta cache"
          git push
