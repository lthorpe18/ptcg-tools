name: Archive Meta History

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-current-field.mjs'
      - '.github/workflows/update-meta.yml'

permissions:
  contents: write

concurrency:
  group: meta-history-archive
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build incremental field and scoped matchups
        run: node scripts/build-current-field.mjs
      - name: Mirror compact field into preview
        run: |
          mkdir -p v2-preview/data/meta
          cp data/meta/current-field.json v2-preview/data/meta/current-field.json
      - name: Commit meta data if changed
        run: |
          git add data/meta/current-field.json data/meta/online-events v2-preview/data/meta/current-field.json
          if git diff --cached --quiet; then
            echo "No meta changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh incremental Limitless meta data"
          git push
