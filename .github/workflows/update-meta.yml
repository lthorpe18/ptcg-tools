name: Archive Meta History

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meta-history-archive
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build compact current field
        run: node scripts/build-current-field.mjs
      - name: Archive detailed meta history
        continue-on-error: true
        run: timeout 8m node scripts/update-meta.mjs
      - name: Mirror compact field into preview
        run: |
          mkdir -p v2-preview/data/meta
          cp data/meta/current-field.json v2-preview/data/meta/current-field.json
      - name: Commit meta data if changed
        run: |
          git add data/meta v2-preview/data/meta/current-field.json
          if git diff --cached --quiet; then
            echo "No meta changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Limitless meta data"
          git push
