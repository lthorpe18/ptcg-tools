name: Archive Meta History

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meta-history-archive
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive Limitless meta data
        run: node scripts/update-meta.mjs
      - name: Commit archive if changed
        run: |
          if git diff --quiet -- data/meta; then
            echo "No archive changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta
          git commit -m "Archive Limitless meta history"
          git push
