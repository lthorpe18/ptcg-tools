name: Archive Meta History

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-current-field.mjs'
      - 'scripts/build-meta-release.mjs'
      - 'scripts/update-blended-performance.mjs'
      - 'scripts/lib/format-config.mjs'
      - 'scripts/lib/blended-model.mjs'
      - 'v2-preview/data/meta/config-default.json'
      - '.github/workflows/update-meta.yml'

permissions:
  contents: write

concurrency:
  group: meta-history-archive
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build incremental current-format field and scoped matchups
        run: node scripts/build-current-field.mjs
      - name: Build validated browser release
        run: node scripts/build-meta-release.mjs
      - name: Update Blended prediction performance
        run: node scripts/update-blended-performance.mjs
      - name: Commit meta data if changed
        run: |
          git add data/meta/current-field.json data/meta/online-events data/meta/online-results v2-preview/data/meta/release v2-preview/data/meta/blended-performance.json
          if git diff --cached --quiet; then
            echo "No meta changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh current-format Limitless meta data"
          git pull --rebase
          git push
