name: Archive Meta History

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-current-field.mjs'
      - 'scripts/prediction-snapshots.mjs'
      - 'scripts/prediction-accuracy.mjs'
      - 'scripts/update-online-formats.mjs'
      - 'scripts/meta-format-contract.mjs'
      - 'data/formats/maintained-calendar.json'
      - '.github/workflows/update-meta.yml'

permissions:
  contents: write

concurrency:
  group: meta-history-archive
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build incremental field and scoped matchups
        run: node scripts/update-online-formats.mjs
      - name: Build validated browser release
        run: node scripts/build-meta-release.mjs
      - name: Build prediction accuracy records
        run: node scripts/prediction-accuracy.mjs
      - name: Commit meta data if changed
        run: |
          git add data/meta/current-field.json data/meta/online-events data/meta/online-results data/meta/online-fields data/meta/prediction-snapshots data/meta/prediction-accuracy v2-preview/data/meta/release
          if git diff --cached --quiet; then
            echo "No meta changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh incremental Limitless meta data"
          git pull --rebase
          git push
