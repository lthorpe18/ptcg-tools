name: Archive Meta History

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-current-field.mjs'
      - 'scripts/update-online-formats.mjs'
      - 'scripts/meta-format-contract.mjs'
      - 'scripts/load-published-calendar.mjs'
      - 'data/formats/maintained-calendar.json'
      - '.github/workflows/update-meta.yml'

permissions:
  contents: write

concurrency:
  group: meta-source-online
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PTCG_FORMAT_SOURCE: published
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build incremental field and scoped matchups
        run: node scripts/update-online-formats.mjs
      - name: Commit Online source data if changed
        run: |
          git add data/meta/current-field.json data/meta/online-events data/meta/online-results data/meta/online-fields
          if git diff --cached --quiet; then
            echo "No Online source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh incremental Limitless meta data"
          git pull --rebase
          git push

  release:
    needs: archive
    if: ${{ needs.archive.result == 'success' }}
    uses: ./.github/workflows/build-meta-release.yml
