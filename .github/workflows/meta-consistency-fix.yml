name: Meta consistency fix
on:
  push:
    branches: [ptcg-tools-v2]
    paths: ['.github/workflows/meta-consistency-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ptcg-tools-v2
          fetch-depth: 0
      - name: Patch Meta source model
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1. Preserve event-level IRL matchup evidence.
          p=Path('scripts/update-irl-labs.mjs')
          s=p.read_text()
          s=s.replace('schemaVersion: 2,', 'schemaVersion: 3,')
          needle="""    for (const d of decks.slice(0, MAX_DECKS_FOR_MATCHUPS)) {
      await sleep(80);
      const mh = await get(`${BASE}/${id}/decks/${d.slug}/matchups`);
      for (const m of parseMatchups(mh, d.name)) {
        const key = `${m.a}|||${m.b}`;
        const row = matchupAgg.get(key) || { a: m.a, b: m.b, games: 0, wins: 0, losses: 0, ties: 0 };
        row.games += m.games;
        row.wins += m.wins;
        row.losses += m.losses;
        row.ties += m.ties;
        matchupAgg.set(key, row);
      }
    }
  }

  const payload = {"""
          repl="""    const eventMatchups = new Map();
    for (const d of decks.slice(0, MAX_DECKS_FOR_MATCHUPS)) {
      await sleep(80);
      const mh = await get(`${BASE}/${id}/decks/${d.slug}/matchups`);
      for (const m of parseMatchups(mh, d.name)) {
        const key = `${m.a}|||${m.b}`;
        const eventRow = eventMatchups.get(key) || { a: m.a, b: m.b, games: 0, wins: 0, losses: 0, ties: 0 };
        eventRow.games += m.games;
        eventRow.wins += m.wins;
        eventRow.losses += m.losses;
        eventRow.ties += m.ties;
        eventMatchups.set(key, eventRow);
        const row = matchupAgg.get(key) || { a: m.a, b: m.b, games: 0, wins: 0, losses: 0, ties: 0 };
        row.games += m.games;
        row.wins += m.wins;
        row.losses += m.losses;
        row.ties += m.ties;
        matchupAgg.set(key, row);
      }
    }
    meta.matchups = [...eventMatchups.values()];
  }

  const payload = {"""
          if needle not in s:
              raise SystemExit('Importer matchup block not found')
          s=s.replace(needle,repl)
          p.write_text(s)

          # 2. Expose one shared IRL scope model from irl-scope.js.
          p=Path('apps/meta/irl-scope.js')
          s=p.read_text()
          marker="""  document.querySelectorAll('[data-current-source]').forEach(button=>button.addEventListener('click',()=>{"""
          api="""
  function aggregateSelectedDecks() {
    const map = new Map();
    for (const event of selectedEvents()) for (const deck of event.decks || []) {
      if (ignored(deck.name)) continue;
      const row = map.get(deck.name) || { name:deck.name, entries:0, wins:0, losses:0, ties:0 };
      for (const key of ['entries','wins','losses','ties']) row[key] += Number(deck[key] || 0);
      map.set(deck.name,row);
    }
    return [...map.values()].sort((a,b)=>b.entries-a.entries);
  }
  function aggregateSelectedMatchups() {
    const chosen = selectedEvents();
    const map = new Map();
    let hasEventEvidence = false;
    for (const event of chosen) for (const m of event.matchups || []) {
      hasEventEvidence = true;
      const key = `${m.a}|||${m.b}`;
      const row = map.get(key) || { a:m.a, b:m.b, games:0, wins:0, losses:0, ties:0 };
      for (const k of ['games','wins','losses','ties']) row[k] += Number(m[k] || 0);
      map.set(key,row);
    }
    if (!hasEventEvidence && irlScope === 'all-irl') return window.IRLLabs?.getData?.()?.matchups || [];
    return [...map.values()];
  }
  function scopeOptions() {
    return [
      { value:'latest-weekend', label:'Latest IRL majors weekend' },
      { value:'all-irl', label:'All IRL majors this format' },
      ...events().map(e => ({ value:`event:${e.id}`, label:`${e.name || 'IRL tournament'} · ${new Date(e.date).toLocaleDateString([], {day:'numeric',month:'short'})}`, event:true }))
    ];
  }
  function setScope(value) {
    const allowed = new Set(scopeOptions().map(x=>x.value));
    irlScope = allowed.has(value) ? value : 'latest-weekend';
    showAll = false; expanded.clear();
    if (irlActive()) { setOptions('irl'); render(); }
    window.dispatchEvent(new CustomEvent('irlscope:changed', { detail:{ scope:irlScope } }));
  }
  window.IRLScope = {
    getScope:()=>irlScope,
    setScope,
    options:scopeOptions,
    selectedEvents:()=>selectedEvents(),
    selectedDecks:aggregateSelectedDecks,
    selectedMatchups:aggregateSelectedMatchups,
  };

"""
          if 'window.IRLScope = {' not in s:
              if marker not in s: raise SystemExit('IRL scope bind marker not found')
              s=s.replace(marker,api+marker)
          s=s.replace("if (irlActive()) { irlScope=event.currentTarget.value; showAll=false; expanded.clear(); setTimeout(render,0); }", "if (irlActive()) { setScope(event.currentTarget.value); }")
          s=s.replace("if (button.dataset.currentSource === 'irl') { irlScope='latest-weekend'; showAll=false; expanded.clear(); setTimeout(render,0); }", "if (button.dataset.currentSource === 'irl') { setScope('latest-weekend'); }")
          p.write_text(s)

          # 3. Make What Should I Play consume the selected IRL scope.
          p=Path('apps/meta/field-builder.js')
          s=p.read_text()
          s=s.replace("const decks = (Array.isArray(data.decks) ? data.decks : []).filter(d => !ignored(d.name));", "const scoped = window.IRLScope?.selectedDecks?.();\n    const decks = (Array.isArray(scoped) ? scoped : (Array.isArray(data.decks) ? data.decks : [])).filter(d => !ignored(d.name));")
          s=s.replace("const irlRows = window.IRLLabs?.getData?.()?.matchups || [];", "const irlRows = window.IRLScope?.selectedMatchups?.() || window.IRLLabs?.getData?.()?.matchups || [];")
          if "window.addEventListener('irlscope:changed'" not in s:
              s=s.replace("window.addEventListener('irl:updated'", "window.addEventListener('irlscope:changed', () => { state.touched = false; syncCustom(true); render(); notify(); });\n  window.addEventListener('irl:updated'")
          p.write_text(s)

          # 4. Make linked Meta explorer use selected IRL scope.
          p=Path('apps/meta/meta-explorer-v2.js')
          s=p.read_text()
          s=s.replace("return source === 'irl' ? (window.IRLLabs?.getData?.()?.decks || []) :", "return source === 'irl' ? (window.IRLScope?.selectedDecks?.() || window.IRLLabs?.getData?.()?.decks || []) :")
          s=s.replace("return source === 'irl' ? (window.IRLLabs?.getData?.()?.matchups || []) :", "return source === 'irl' ? (window.IRLScope?.selectedMatchups?.() || window.IRLLabs?.getData?.()?.matchups || []) :")
          if "window.addEventListener('irlscope:changed'" not in s:
              s=s.replace("window.addEventListener('irl:updated'", "window.addEventListener('irlscope:changed',()=>{ if (!queryHidden('matchups')) setTimeout(renderMatchupsV2,0); if (!queryHidden('decks')) setTimeout(renderDeckExplorerV2,0); if (!queryHidden('deckDetail')) renderDetail(); });\n  window.addEventListener('irl:updated'")
              # helper needed by injected listener
              s=s.replace("let matchupDeck = '';", "let matchupDeck = '';\n  const queryHidden = id => $(id)?.classList.contains('hidden') !== false;")
          p.write_text(s)

          # 5. Clarify Custom as the editable/savable field mode.
          p=Path('apps/meta/index.html')
          s=p.read_text()
          s=s.replace('<option value="custom">Custom</option>', '<option value="custom">Custom / saved meta</option>')
          s=s.replace('<option value="custom">Custom field</option>', '<option value="custom">Custom / saved meta</option>')
          if 'meta-consistency-v3.js' not in s:
              s=s.replace('<script src="meta-explorer-v2.js?v=1"></script>', '<script src="meta-explorer-v2.js?v=1"></script>\n<script src="meta-consistency-v3.js?v=1"></script>')
          p.write_text(s)
          PY

          cat > apps/meta/meta-consistency-v3.js <<'JS'
          (() => {
            'use strict';
            const $ = id => document.getElementById(id);
            const esc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

            function scopeOptionsHtml() {
              const options = window.IRLScope?.options?.() || [];
              const main = options.filter(x=>!x.event).map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join('');
              const events = options.filter(x=>x.event).map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join('');
              return main + (events ? `<optgroup label="Individual tournaments">${events}</optgroup>` : '');
            }
            function ensureScopeControl(container, id, label='IRL scope') {
              if (!container) return null;
              let wrap = $(id+'Wrap');
              if (!wrap) {
                wrap=document.createElement('label'); wrap.id=id+'Wrap'; wrap.className='meta-shared-scope';
                wrap.innerHTML=`<span>${label}</span><select id="${id}"></select>`;
                container.appendChild(wrap);
                $(id).addEventListener('change',e=>window.IRLScope?.setScope?.(e.currentTarget.value));
              }
              const select=$(id); select.innerHTML=scopeOptionsHtml(); select.value=window.IRLScope?.getScope?.() || 'latest-weekend';
              return wrap;
            }
            function syncScopeControls() {
              const scope=window.IRLScope?.getScope?.() || 'latest-weekend';
              const matchupSource=$('matchupPageSource')?.value || 'online';
              const deckSource=$('deckPageSource')?.value || 'online';
              const fieldSource=$('playFieldSource')?.value || 'online';
              const playMatchups=$('playMatchupSource')?.value || 'online';

              const m=ensureScopeControl($('matchupPageSource')?.closest('.single-source-control'),'matchupIrlScope');
              if(m) m.hidden=matchupSource!=='irl';
              const d=ensureScopeControl($('deckPageSource')?.closest('.single-source-control'),'deckIrlScope');
              if(d) d.hidden=deckSource!=='irl';

              let playWrap=$('playIrlScopeWrap');
              if(!playWrap){
                playWrap=document.createElement('div'); playWrap.id='playIrlScopeWrap'; playWrap.className='play-shared-scope';
                $('playFieldSource')?.closest('.meta-child-header')?.appendChild(playWrap);
              }
              playWrap.innerHTML='';
              const needs=fieldSource==='irl'||fieldSource==='blend'||playMatchups==='irl'||playMatchups==='combined';
              if(needs){
                playWrap.innerHTML=`<label><span>IRL scope</span><select id="playIrlScope">${scopeOptionsHtml()}</select></label><small>Used by every IRL component of this analysis.</small>`;
                $('playIrlScope').value=scope;
                $('playIrlScope').addEventListener('change',e=>window.IRLScope?.setScope?.(e.currentTarget.value));
              }
              playWrap.hidden=!needs;

              document.querySelectorAll('#matchupIrlScope,#deckIrlScope').forEach(x=>x.value=scope);
            }

            // Saved metas are presets of the custom field, not a separate source.
            function clarifyCustomField() {
              const source=$('playFieldSource'); if(!source) return;
              let note=$('customFieldMeaning');
              if(!note){ note=document.createElement('p'); note.id='customFieldMeaning'; note.className='custom-field-meaning'; source.closest('.child-source-row')?.after(note); }
              note.hidden=source.value!=='custom';
              note.textContent='Custom is your editable field. Saved metas are named presets of this same custom field; load one below or edit and save the current composition.';
            }

            // Explicitly own nested explainers so deck-link capture cannot interfere with Safari details toggling.
            document.addEventListener('click', event => {
              const summary=event.target.closest('.rec-why > summary,.check-details > summary,.full-calculation > summary');
              if(!summary) return;
              event.preventDefault();
              event.stopPropagation();
              const details=summary.parentElement;
              if(details?.tagName==='DETAILS') details.open=!details.open;
            }, true);

            ['matchupPageSource','deckPageSource','playFieldSource','playMatchupSource'].forEach(id=>$(id)?.addEventListener('change',()=>setTimeout(()=>{syncScopeControls();clarifyCustomField();},0)));
            window.addEventListener('irlscope:changed',()=>setTimeout(syncScopeControls,0));
            window.addEventListener('irl:updated',()=>setTimeout(syncScopeControls,0));
            setTimeout(()=>{syncScopeControls();clarifyCustomField();},0);
          })();
          JS

          cat >> apps/meta/meta-explorer-v2.css <<'CSS'
          .meta-shared-scope,.play-shared-scope label{display:grid;gap:4px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#667085}.meta-shared-scope{flex:1}.meta-shared-scope select,.play-shared-scope select{width:100%;min-width:0;min-height:42px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;padding:0 10px;color:#101828;font:inherit;font-size:13px;font-weight:700}.play-shared-scope{display:grid;gap:4px}.play-shared-scope small,.custom-field-meaning{margin:0;color:#667085;font-size:10px;line-height:1.35}.custom-field-meaning{padding:8px 10px;border:1px solid #e4e7ec;border-radius:10px;background:#fff}.single-source-control{flex-wrap:wrap;min-width:0}.single-source-control>*{min-width:0}@media(max-width:600px){.single-source-control{display:grid!important;grid-template-columns:1fr}.meta-shared-scope{width:100%}.play-shared-scope{width:100%}}
          CSS
      - name: Refresh IRL data with event matchups
        run: node scripts/update-irl-labs.mjs
      - name: Validate
        run: |
          node --check scripts/update-irl-labs.mjs
          node --check apps/meta/irl-scope.js
          node --check apps/meta/field-builder.js
          node --check apps/meta/meta-explorer-v2.js
          node --check apps/meta/meta-consistency-v3.js
          node - <<'JS'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('data/meta/irl/TEF-PBL.json','utf8'));
          if(d.schemaVersion<3) throw Error('IRL schema not updated');
          if(d.events.length && !d.events.every(e=>Array.isArray(e.matchups))) throw Error('event matchups missing');
          console.log('IRL events',d.events.map(e=>`${e.name}: ${e.matchups.length} matchup rows`).join(' | '));
          JS
          grep -q 'Custom / saved meta' apps/meta/index.html
          grep -q 'meta-consistency-v3.js?v=1' apps/meta/index.html
      - name: Commit source and data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/update-irl-labs.mjs apps/meta data/meta/irl/TEF-PBL.json
          git commit -m 'Unify Meta source scopes and explainers'
          git push origin HEAD:ptcg-tools-v2
      - name: Stage preview files
        run: |
          mkdir -p /tmp/meta-consistency/data
          cp apps/meta/index.html apps/meta/irl-scope.js apps/meta/field-builder.js apps/meta/meta-explorer-v2.js apps/meta/meta-explorer-v2.css apps/meta/meta-consistency-v3.js /tmp/meta-consistency/
          cp data/meta/irl/TEF-PBL.json /tmp/meta-consistency/data/
      - name: Publish preview
        run: |
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/meta-consistency/index.html v2-preview/apps/meta/index.html
          cp /tmp/meta-consistency/irl-scope.js v2-preview/apps/meta/irl-scope.js
          cp /tmp/meta-consistency/field-builder.js v2-preview/apps/meta/field-builder.js
          cp /tmp/meta-consistency/meta-explorer-v2.js v2-preview/apps/meta/meta-explorer-v2.js
          cp /tmp/meta-consistency/meta-explorer-v2.css v2-preview/apps/meta/meta-explorer-v2.css
          cp /tmp/meta-consistency/meta-consistency-v3.js v2-preview/apps/meta/meta-consistency-v3.js
          cp /tmp/meta-consistency/data/TEF-PBL.json v2-preview/data/meta/irl/TEF-PBL.json
          node --check v2-preview/apps/meta/meta-consistency-v3.js
          node --check v2-preview/apps/meta/meta-explorer-v2.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2-preview/apps/meta v2-preview/data/meta/irl/TEF-PBL.json
          git commit -m 'Publish consistent Meta source model'
          git push origin HEAD:main
