name: Bust Meta consistency once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bust-meta-consistency-once.yml'
permissions:
  contents: write
jobs:
  bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bust preview loader cache
        run: |
          sed -i 's/irl-labs.js?v=4/irl-labs.js?v=5/' v2-preview/apps/meta/index.html
          grep -q 'irl-labs.js?v=5' v2-preview/apps/meta/index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2-preview/apps/meta/index.html
          git commit -m 'Bust Meta consistency loader cache'
          git push origin HEAD:main
