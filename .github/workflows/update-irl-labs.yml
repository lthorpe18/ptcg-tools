name: Update IRL Meta

on:
  push:
    paths:
      - 'scripts/update-irl-labs.mjs'
      - 'scripts/validate-current-irl.mjs'
      - 'scripts/build-meta-release.mjs'
      - 'scripts/update-blended-performance.mjs'
      - 'scripts/lib/format-config.mjs'
      - 'scripts/lib/blended-model.mjs'
      - 'v2-preview/data/meta/config-default.json'
      - '.github/workflows/update-irl-labs.yml'
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-irl-meta
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read Limitless Labs current-format majors
        run: node scripts/update-irl-labs.mjs
      - name: Validate current-format IRL dataset
        run: node scripts/validate-current-irl.mjs
      - name: Build validated browser release
        run: node scripts/build-meta-release.mjs
      - name: Evaluate completed Major predictions
        run: node scripts/update-blended-performance.mjs
      - name: Publish IRL dataset
        run: |
          if git diff --quiet -- data/meta/irl v2-preview/data/meta/release v2-preview/data/meta/blended-performance.json; then
            echo "IRL dataset unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta/irl v2-preview/data/meta/release v2-preview/data/meta/blended-performance.json
          git commit -m "Update current-format Limitless Labs IRL meta"
          git pull --rebase
          git push
