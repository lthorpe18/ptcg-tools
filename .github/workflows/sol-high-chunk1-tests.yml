name: Sol High chunk 1 validation

on:
  push:
    branches:
      - fix/sol-high-polish-chunk-1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
