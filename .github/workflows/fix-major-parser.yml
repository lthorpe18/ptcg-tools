name: Fix major parser detection

on:
  push:
    branches:
      - ptcg-tools-v2
    paths:
      - '.github/workflows/fix-major-parser.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ptcg-tools-v2
      - name: Patch importer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/import_events.py')
          s = p.read_text()
          s = s.replace('self.upcoming = False\n        self.in_heading', 'self.upcoming = True\n        self.in_heading', 1)
          s = s.replace('if "Upcoming Pokémon Events" not in body and "Upcoming Pokemon Events" not in body:\n        raise RuntimeError("RK9 page no longer contains the upcoming Pokemon events heading")', 'if "Regional Championships" not in body and "World Championships" not in body:\n        raise RuntimeError("RK9 page no longer contains recognizable Championship event rows")')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/import_events.py
          git commit -m 'Fix RK9 major table detection'
          git push origin HEAD:ptcg-tools-v2
