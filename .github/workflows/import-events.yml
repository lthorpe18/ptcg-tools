name: Import PTCG Events

# Imports local Pokédata events and Championship-series majors.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  push:
    branches:
      - ptcg-tools-v2
    paths:
      - 'scripts/import_events.py'
      - '.github/workflows/import-events.yml'

permissions:
  contents: write

jobs:
  import-events:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V2 branch
        uses: actions/checkout@v4
        with:
          ref: ptcg-tools-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Import and validate events
        run: python scripts/import_events.py

      - name: Validate generated JSON
        run: python -m json.tool data/events.json > /dev/null

      - name: Commit updated event dataset
        run: |
          if [ -z "$(git status --porcelain -- data/events.json)" ]; then
            echo 'No V2 event data changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events.json
          git commit -m 'Refresh event dataset'
          git push origin HEAD:ptcg-tools-v2

      - name: Mirror event dataset into V2 preview
        run: |
          cp data/events.json /tmp/ptcg-events.json
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p v2-preview/data
          cp /tmp/ptcg-events.json v2-preview/data/events.json
          if [ -z "$(git status --porcelain -- v2-preview/data/events.json)" ]; then
            echo 'Preview event data already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2-preview/data/events.json
          git commit -m 'Refresh V2 preview event dataset'
          git push origin HEAD:main
