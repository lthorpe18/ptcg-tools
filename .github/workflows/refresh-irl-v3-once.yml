name: Refresh IRL v3 once
on:
  push:
    branches: [ptcg-tools-v2]
    paths:
      - '.github/workflows/refresh-irl-v3-once.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ptcg-tools-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh
        run: node scripts/update-irl-labs.mjs
      - name: Validate
        run: |
          node --check scripts/update-irl-labs.mjs
          node -e "const d=require('./data/meta/irl/TEF-PBL.json');if(d.schemaVersion<3)process.exit(1);if(d.events.some(e=>!Array.isArray(e.matchups)))process.exit(1);console.log(d.events.map(e=>e.name+': '+e.matchups.length).join(' | '))"
      - name: Commit branch data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/meta/irl/TEF-PBL.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh IRL event matchup data'
            git push origin HEAD:ptcg-tools-v2
          fi
      - name: Publish preview data
        run: |
          cp data/meta/irl/TEF-PBL.json /tmp/TEF-PBL.json
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/TEF-PBL.json v2-preview/data/meta/irl/TEF-PBL.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2-preview/data/meta/irl/TEF-PBL.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish IRL event matchup data'
            git push origin HEAD:main
          fi
