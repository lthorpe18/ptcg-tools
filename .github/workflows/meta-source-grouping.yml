name: Wire Meta source controls and grouping

on:
  push:
    branches: [ptcg-tools-v2]
    paths: ['.github/workflows/meta-source-grouping.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ptcg-tools-v2
          fetch-depth: 0
      - name: Patch Meta UI and grouping
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('apps/meta/index.html')
          s=p.read_text()
          marker='<main class="wrap">\n'
          block='''<main class="wrap">\n  <section class="meta-source-bar" aria-label="Meta data sources">\n    <div class="meta-source-head"><div><span class="eyebrow">DATA MODEL</span><strong>What should this analysis use?</strong></div><small id="metaSourceSummary"></small></div>\n    <div class="meta-source-grid">\n      <label><span>Meta share</span><select id="metaFieldSource"><option value="online">Online</option><option value="irl">IRL</option><option value="blend">Online + IRL blend</option><option value="custom">Custom</option></select><small>What people are playing</small></label>\n      <label><span>Matchups</span><select id="metaMatchupSource"><option value="online">Online</option><option value="irl">IRL</option><option value="combined">Online + IRL</option></select><small>Head-to-head evidence</small></label>\n      <label><span>Archetypes</span><select id="archetypeGrouping"><option value="families" selected>Group variants</option><option value="variants">Show variants separately</option></select><small>Combine related builds</small></label>\n    </div>\n  </section>\n'''
          if 'id="metaFieldSource"' not in s:
              s=s.replace(marker,block,1)
          if 'source-controls.css' not in s:
              s=s.replace('<link rel="stylesheet" href="v2.css?v=1" />','<link rel="stylesheet" href="v2.css?v=1" />\n  <link rel="stylesheet" href="source-controls.css?v=1" />')
          if 'archetype-groups.js' not in s:
              s=s.replace('<script src="field-builder.js?v=4"></script>','<script src="archetype-groups.js?v=1"></script>\n<script src="field-builder.js?v=5"></script>')
          if 'source-controls.js' not in s:
              s=s.replace('<script src="prep.js?v=4"></script>','<script src="source-controls.js?v=1"></script>\n<script src="prep.js?v=5"></script>')
          p.write_text(s)

          p=Path('apps/meta/field-builder.js')
          s=p.read_text()
          s=s.replace("    return [...counts.entries()].map(([name, value]) => ({ name, share: total ? value / total : 0, source: 'online' }));", "    const rows=[...counts.entries()].map(([name, value]) => ({ name, share: total ? value / total : 0, source: 'online' }));\n    return window.ArchetypeGroups?.groupRows?.(rows, 'share') || rows;")
          s=s.replace("    return decks.map(d => ({ name: d.name, share: total ? Number(d.entries || 0) / total : Number(d.share || 0), source: 'irl' }));", "    const rows=decks.map(d => ({ name: d.name, share: total ? Number(d.entries || 0) / total : Number(d.share || 0), source: 'irl' }));\n    return window.ArchetypeGroups?.groupRows?.(rows, 'share') || rows;")
          old="""    const online = onlineMatchup(candidate, opponent);\n    const irlRows = window.IRLLabs?.getData?.()?.matchups || [];\n    const irl = irlRows.find(m => m.a === candidate && m.b === opponent && !ignored(m.a) && !ignored(m.b)) || null;"""
          new="""    const candidateVariants = window.ArchetypeGroups?.variants?.(candidate) || [candidate];\n    const opponentVariants = window.ArchetypeGroups?.variants?.(opponent) || [opponent];\n    const combine = rows => {\n      const valid=rows.filter(Boolean);\n      if(!valid.length)return null;\n      return valid.reduce((out,m)=>({a:candidate,b:opponent,wins:out.wins+Number(m.wins||0),losses:out.losses+Number(m.losses||0),ties:out.ties+Number(m.ties||0),games:out.games+Number(m.games||Number(m.wins||0)+Number(m.losses||0)+Number(m.ties||0))}),{wins:0,losses:0,ties:0,games:0});\n    };\n    const online = combine(candidateVariants.flatMap(a=>opponentVariants.map(b=>onlineMatchup(a,b))));\n    const irlRows = window.IRLLabs?.getData?.()?.matchups || [];\n    const irl = combine(candidateVariants.flatMap(a=>opponentVariants.map(b=>irlRows.find(m => m.a === a && m.b === b && !ignored(m.a) && !ignored(m.b)) || null)));"""
          if old not in s:
              raise SystemExit('field-builder matchup anchor not found')
          s=s.replace(old,new,1)
          s=s.replace("    window.addEventListener('deckagg:updated', () => notify());", "    window.addEventListener('deckagg:updated', () => notify());\n    window.addEventListener('archetype-grouping:changed', () => { state.touched=false; syncCustom(true); render(); notify(); });")
          p.write_text(s)

          p=Path('apps/meta/prep.js')
          s=p.read_text()
          old="""    for (const row of map.values()) {\n      const decisive = row.wins + row.losses;\n      row.winRate = decisive ? 100 * row.wins / decisive : null;\n    }\n    return map;"""
          new="""    const grouped = window.ArchetypeGroups?.aggregateRecords?.([...map.values()]) || [...map.values()];\n    return new Map(grouped.map(row => [row.name, row]));"""
          if old not in s:
              raise SystemExit('prep aggregate anchor not found')
          s=s.replace(old,new,1)
          s=s.replace("window.addEventListener('irl:updated', render);", "window.addEventListener('irl:updated', render);\n  window.addEventListener('archetype-grouping:changed', render);") if "window.addEventListener('irl:updated', render);" in s else s
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          node --check apps/meta/archetype-groups.js
          node --check apps/meta/source-controls.js
          node --check apps/meta/field-builder.js
          node --check apps/meta/prep.js
          grep -q 'id="metaFieldSource"' apps/meta/index.html
          grep -q 'id="metaMatchupSource"' apps/meta/index.html
          grep -q 'id="archetypeGrouping"' apps/meta/index.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/meta/index.html apps/meta/field-builder.js apps/meta/prep.js
          git commit -m 'Expose meta sources and group archetype variants'
          git push origin HEAD:ptcg-tools-v2
