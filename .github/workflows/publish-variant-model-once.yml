name: Publish variant-level Meta model once
on:
  push:
    branches: [ptcg-tools-v2]
    paths:
      - '.github/workflows/publish-variant-model-once.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ptcg-tools-v2
          fetch-depth: 0
      - name: Wire variant model
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/meta/index.html')
          s=p.read_text()
          s=s.replace('meta-explorer-v2.css?v=1','meta-explorer-v2.css?v=2')
          s=s.replace('source-controls.js?v=2','source-controls.js?v=3')
          s=s.replace('meta-explorer-v2.js?v=1','meta-explorer-v2.js?v=2')
          s=s.replace('<option value="custom">Custom</option>','<option value="custom">Custom / saved meta</option>')
          s=s.replace('<option value="custom">Custom field</option>','<option value="custom">Custom / saved meta</option>')
          s=s.replace('<p>Family-level results combine the underlying variant records.</p>','<p>Head-to-head evidence is shown for exact deck variants.</p>')
          s=s.replace('<p>Browse the current field without changing the landing page.</p>','<p>Browse family share, then open exact variants for performance and matchups.</p>')
          s=s.replace('<select id="archetypeGrouping"><option value="families" selected>Families</option><option value="variants">Variants</option></select>','<select id="archetypeGrouping"><option value="families">Families</option><option value="variants" selected>Variants</option></select>')
          if 'meta-consistency-v3.js' not in s:
              s=s.replace('<script src="meta-explorer-v2.js?v=2"></script>','<script src="meta-consistency-v3.js?v=2"></script>\n<script src="meta-explorer-v2.js?v=2"></script>')
          p.write_text(s)
          PY
      - name: Validate source
        run: |
          node --check apps/meta/meta-explorer-v2.js
          node --check apps/meta/source-controls.js
          node --check apps/meta/meta-consistency-v3.js
          ! grep -q 'aggregateMatchup' apps/meta/meta-explorer-v2.js
          grep -q 'exactMatchup' apps/meta/meta-explorer-v2.js
          grep -q 'grouping.value = .variants.' apps/meta/source-controls.js
          grep -q 'meta-consistency-v3.js?v=2' apps/meta/index.html
          grep -q 'meta-explorer-v2.js?v=2' apps/meta/index.html
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/meta
          git commit -m 'Make Meta grouping field-only and matchups variant-level'
          git push origin HEAD:ptcg-tools-v2
      - name: Stage preview files
        run: |
          mkdir -p /tmp/meta-variant
          cp apps/meta/index.html apps/meta/source-controls.js apps/meta/meta-explorer-v2.js apps/meta/meta-explorer-v2.css apps/meta/meta-consistency-v3.js /tmp/meta-variant/
      - name: Publish preview
        run: |
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/meta-variant/index.html v2-preview/apps/meta/index.html
          cp /tmp/meta-variant/source-controls.js v2-preview/apps/meta/source-controls.js
          cp /tmp/meta-variant/meta-explorer-v2.js v2-preview/apps/meta/meta-explorer-v2.js
          cp /tmp/meta-variant/meta-explorer-v2.css v2-preview/apps/meta/meta-explorer-v2.css
          cp /tmp/meta-variant/meta-consistency-v3.js v2-preview/apps/meta/meta-consistency-v3.js
          node --check v2-preview/apps/meta/meta-explorer-v2.js
          node --check v2-preview/apps/meta/source-controls.js
          node --check v2-preview/apps/meta/meta-consistency-v3.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2-preview/apps/meta
          git commit -m 'Publish variant-level Meta exploration'
          git push origin HEAD:main
