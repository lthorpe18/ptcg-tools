name: Probe RK9 majors source

on:
  workflow_dispatch:
  push:
    branches:
      - ptcg-tools-v2
    paths:
      - 'scripts/probe_rk9.py'
      - '.github/workflows/probe-rk9.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/probe_rk9.py
