name: Probe Pokemon Event Locator

on:
  push:
    branches: [ptcg-tools-v2]
    paths:
      - 'scripts/event-locator-probe.mjs'
      - '.github/workflows/event-locator-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probe Bristol-area Event Locator
        run: node scripts/event-locator-probe.mjs
      - name: Upload probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-locator-probe
          path: artifacts/event-locator-probe
          if-no-files-found: warn
          retention-days: 3
