name: Validate Meta Lab

on:
  push:
    paths:
      - 'apps/meta/**'
      - 'v2-preview/apps/meta/**'
      - 'v2-preview/scripts/persistent-shell.js'
      - 'v2-preview/apps/_shared/meta-blend.js'
      - 'v2-preview/apps/_shared/meta-field.js'
      - 'v2-preview/apps/_shared/recommendation-engine.js'
      - 'v2-preview/data/meta/release/**'
      - 'scripts/build-meta-release.mjs'
      - 'v2-preview/index.html'
      - 'tests/meta-navigation.test.js'
      - 'tests/meta-release.test.mjs'
      - 'tests/recommendation-engine.test.js'
      - 'tests/wsip-integration.test.js'
      - '.github/workflows/validate-meta-lab.yml'
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check Meta JavaScript
        run: |
          set -e
          for dir in apps/meta v2-preview/apps/meta; do
            for file in "$dir"/*.js; do
              [ -e "$file" ] || continue
              echo "Checking $file"
              node --check "$file"
            done
          done
          node --check v2-preview/apps/_shared/meta-field.js
          node --check v2-preview/apps/_shared/recommendation-engine.js
      - name: Check required V2 Meta hooks
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('v2-preview/apps/meta/index.html', 'utf8');
          const requiredIds = [
            'currentMetaPage','currentWindow','currentGroupingToggle',
            'prep','playFieldSource','playMatchupSource','playSourceContext',
            'prepFieldOverview','prepResults','prepCompare','fieldEditor',
            'matchups','matchupPageSource','decks','deckPageSource','deckDetail'
          ];
          const missing = requiredIds.filter(id => !html.includes(`id="${id}"`));
          if (missing.length) throw new Error(`Missing V2 Meta hooks: ${missing.join(', ')}`);

          const requiredScripts = ['meta-field.js','meta-release-loader.js','meta-core.js','meta-blend.js','recommendation-engine.js','meta-controls.js','prep.js','meta-home.js','meta-explorer-v3.js','meta-source-context.js','meta-router.js'];
          const absentScripts = requiredScripts.filter(name => !html.includes(name));
          if (absentScripts.length) throw new Error(`Missing unified Meta scripts: ${absentScripts.join(', ')}`);

          const retired = ['app.js','meta-engine.js','limitless.js','live.js','deck-aggregate.js','irl-labs.js','irl-scope.js','meta-consistency-v3.js','meta-window-fix.js','source-controls.js','meta-scope-controls.js','meta-detail-scope.js','meta-navigation.js','meta-explorer-v2.js','meta-results-v2.js','meta-table.js'];
          const reintroduced = retired.filter(name => html.includes(name));
          if (reintroduced.length) throw new Error(`Retired Meta runtime layers reintroduced: ${reintroduced.join(', ')}`);

          console.log('Validated unified V2 Meta runtime contract');
          NODE
      - name: Check Meta architecture contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const core = fs.readFileSync('v2-preview/apps/meta/meta-core.js', 'utf8');
          const controls = fs.readFileSync('v2-preview/apps/meta/meta-controls.js', 'utf8');
          const architecture = fs.readFileSync('v2-preview/apps/meta/ARCHITECTURE.md', 'utf8');
          for (const token of ['window.MetaState','window.MetaData']) {
            if (!core.includes(token)) throw new Error(`Meta core missing ${token}`);
          }
          if (!controls.includes('window.MetaState')) throw new Error('Meta controls are not bound to shared MetaState');
          if (!architecture.includes('Variant grouping is presentation-only')) throw new Error('Meta architecture document is missing grouping lock');
          console.log('Validated Meta state/data/control ownership');
          NODE
      - name: Test Meta navigation contract
        run: node --test tests/meta-navigation.test.js tests/meta-release.test.mjs tests/recommendation-engine.test.js tests/wsip-integration.test.js
