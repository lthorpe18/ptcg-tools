name: Update Limitless Deck Matchups

on:
  schedule:
    - cron: '17 6,18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-limitless-decks.mjs'
      - 'scripts/meta-format-contract.mjs'
      - 'scripts/load-published-calendar.mjs'
      - 'data/formats/maintained-calendar.json'
      - '.github/workflows/update-limitless-decks.yml'

permissions:
  contents: write

concurrency:
  group: meta-source-decks
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PTCG_FORMAT_SOURCE: published
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read current-format aggregate deck and matchup data
        run: node scripts/update-limitless-decks.mjs
      - name: Publish deck matchup source data
        run: |
          if [ -z "$(git status --porcelain -- data/meta/decks)" ]; then
            echo "Deck matchup dataset unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta/decks
          git commit -m "Update Limitless deck matchups"
          git pull --rebase
          git push
