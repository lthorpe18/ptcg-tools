name: Update Limitless Deck Matchups

on:
  schedule:
    - cron: '17 6,18 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update-limitless-decks.mjs'
      - 'scripts/build-meta-release.mjs'
      - 'scripts/lib/format-config.mjs'
      - 'v2-preview/data/meta/config-default.json'
      - '.github/workflows/update-limitless-decks.yml'

permissions:
  contents: write

concurrency:
  group: update-limitless-decks
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read current-format aggregate deck and matchup data
        run: node scripts/update-limitless-decks.mjs
      - name: Build validated browser release
        run: node scripts/build-meta-release.mjs
      - name: Publish deck matchup dataset
        run: |
          if [ -z "$(git status --porcelain -- data/meta/decks v2-preview/data/meta/release)" ]; then
            echo "Deck matchup dataset unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta/decks v2-preview/data/meta/release
          git commit -m "Update current-format Limitless deck matchups"
          git pull --rebase
          git push
